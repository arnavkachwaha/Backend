<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>
</head>
<body>
    <h1>Upload Your Video</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div>
            {{ form.name.label_tag }}<br>
            {{ form.name }}
        </div>
        <div>
            {{ form.videofile.label_tag }}<br>
            {{ form.videofile }}
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>

    <h2>Fetch Processed Video</h2>
    <button id="fetch-video-btn">Get Video</button>
    <div id="video-container"></div>

    <script>
        document.getElementById("fetch-video-btn").addEventListener("click", function() {
            fetch('/cyclops/fetch_processed_video/')  <!-- Correct URL without space -->
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.blob();
                })
                .then(blob => {
                    // Create a URL for the video blob
                    const videoURL = URL.createObjectURL(blob);
                    const videoContainer = document.getElementById("video-container");
    
                    // Create a video element and append it to the container
                    const videoElement = document.createElement("video");
                    videoElement.src = videoURL;
                    videoElement.controls = true;
                    videoElement.width = 640;  // Set video width
                    videoElement.height = 480;  // Set video height
    
                    // Clear the container and add the video element
                    videoContainer.innerHTML = '';
                    videoContainer.appendChild(videoElement);
                })
                .catch(error => {
                    console.error('Error fetching video:', error);
                });
        });
    </script>
    
</body>
</html>
